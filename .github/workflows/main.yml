name: sporty

on:
  repository_dispatch:
    types: [run-sporty]
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 358

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run runner.py and stream logs to Better Stack
        run: |
          set -o pipefail

          timeout 355m python3 -u runner.py 2>&1 | while IFS= read -r line; do
            echo "$line"

            curl -s \
              -X POST \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer HTDDFiFL3EQHmRCJ2c9vH7gu" \
              -d "{\"dt\":\"$(date -u +'%Y-%m-%d %H:%M:%S UTC')\",\"message\":\"${line//\"/\\\"}\"}" \
              https://s2622110.eu-central-1a.betterstackdata.com >/dev/null
          done || true
